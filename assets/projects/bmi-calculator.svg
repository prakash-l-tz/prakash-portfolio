<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="1" stop-color="#05302f"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#34d399" stop-opacity=".45"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132447"/><stop offset="1" stop-color="#0a1428"/></linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset=".45" stop-color="#34d399"/><stop offset=".72" stop-color="#facc15"/><stop offset="1" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#4f8ff7"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".07"/></pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <circle cx="150" cy="110" r="240" fill="url(#g1)"/>
  <circle cx="680" cy="420" r="260" fill="url(#g2)"/>

  <!-- left card: measurements -->
  <g transform="rotate(-6 165 225)">
    <rect x="70" y="160" width="190" height="130" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".18"/>
    <circle cx="105" cy="198" r="18" fill="#22d3ee" fill-opacity=".2"/>
    <path d="M97 205h16l-3-12h-10z M105 193v-5" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="194" fill="#a3b3cf" font-size="12">Height</text>
    <text x="134" y="212" fill="#e8eef9" font-size="16" font-weight="700">175 cm</text>
    <text x="90" y="250" fill="#a3b3cf" font-size="12">Weight</text>
    <text x="90" y="270" fill="#e8eef9" font-size="16" font-weight="700">68 kg</text>
    <rect x="170" y="252" width="70" height="18" rx="9" fill="#34d399" fill-opacity=".18"/>
    <text x="205" y="265" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Healthy</text>
  </g>

  <!-- right card: categories -->
  <g transform="rotate(5 640 190)">
    <rect x="550" y="100" width="185" height="170" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="570" y="130" fill="#e8eef9" font-size="14" font-weight="700">BMI ranges</text>
    <rect x="570" y="148" width="22" height="100" rx="6" fill="#38bdf8" fill-opacity=".35"/>
    <rect x="602" y="168" width="22" height="80" rx="6" fill="#34d399"/>
    <rect x="634" y="190" width="22" height="58" rx="6" fill="#facc15" fill-opacity=".55"/>
    <rect x="666" y="210" width="22" height="38" rx="6" fill="#f87171" fill-opacity=".55"/>
    <rect x="698" y="226" width="22" height="22" rx="6" fill="#f87171" fill-opacity=".3"/>
  </g>

  <!-- tape measure -->
  <g opacity=".85">
    <path d="M60 430 Q 240 380 400 470" stroke="#facc15" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M60 430 Q 240 380 400 470" stroke="#7c5b06" stroke-width="2" stroke-dasharray="2 10" fill="none"/>
  </g>

  <!-- phone -->
  <rect x="290" y="30" width="220" height="450" rx="36" fill="#050b18" stroke="#2f4a7c" stroke-width="2"/>
  <rect x="302" y="42" width="196" height="426" rx="28" fill="url(#screen)"/>
  <rect x="368" y="52" width="64" height="9" rx="4.5" fill="#050b18"/>
  <text x="322" y="96" fill="#e8eef9" font-size="18" font-weight="800">BMI Calculator</text>

  <path d="M330 205 A70 70 0 0 1 470 205" stroke="#1e3156" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M330 205 A70 70 0 0 1 470 205" stroke="url(#gauge)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <line x1="400" y1="205" x2="424" y2="150" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="205" r="8" fill="#ffffff"/>
  <text x="400" y="250" fill="#ffffff" font-size="36" font-weight="800" text-anchor="middle">22.4</text>
  <text x="400" y="272" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle">Normal weight</text>

  <text x="322" y="310" fill="#a3b3cf" font-size="12">Height</text>
  <rect x="322" y="320" width="156" height="6" rx="3" fill="#223660"/>
  <rect x="322" y="320" width="100" height="6" rx="3" fill="#22d3ee"/>
  <circle cx="422" cy="323" r="9" fill="#ffffff"/>
  <text x="322" y="352" fill="#a3b3cf" font-size="12">Weight</text>
  <rect x="322" y="362" width="156" height="6" rx="3" fill="#223660"/>
  <rect x="322" y="362" width="72" height="6" rx="3" fill="#22d3ee"/>
  <circle cx="394" cy="365" r="9" fill="#ffffff"/>

  <rect x="322" y="398" width="156" height="42" rx="21" fill="url(#btn)"/>
  <text x="400" y="424" fill="#04121f" font-size="15" font-weight="700" text-anchor="middle">Calculate</text>
</svg>
