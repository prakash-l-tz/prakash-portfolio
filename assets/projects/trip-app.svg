<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset=".55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fde68a"/><stop offset=".6" stop-color="#fb923c" stop-opacity=".7"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5a4"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <clipPath id="photo"><rect x="314" y="110" width="172" height="120" rx="16"/></clipPath>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="620" cy="330" r="170" fill="url(#sun)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="50" r="1.6" opacity=".8"/><circle cx="180" cy="90" r="1.2" opacity=".6"/>
    <circle cx="560" cy="40" r="1.5" opacity=".8"/><circle cx="700" cy="80" r="1.2" opacity=".6"/>
    <circle cx="250" cy="30" r="1" opacity=".7"/><circle cx="740" cy="160" r="1.3" opacity=".5"/>
  </g>
  <!-- mountains -->
  <path d="M0 360 L120 250 L210 330 L320 220 L430 340 L540 260 L660 350 L800 270 L800 500 L0 500 Z" fill="#3b0764" opacity=".75"/>
  <path d="M0 410 L140 320 L260 400 L380 330 L520 420 L650 340 L800 400 L800 500 L0 500 Z" fill="#1e1b4b"/>
  <path d="M0 460 Q200 420 400 455 T800 445 L800 500 L0 500 Z" fill="#0f0c2e"/>

  <!-- flight path -->
  <path d="M60 300 C 160 120, 600 40, 740 200" stroke="#ffffff" stroke-opacity=".75" stroke-width="2.5" stroke-dasharray="8 10" fill="none"/>
  <g transform="translate(205 128) rotate(-28)">
    <path d="M-18 0 L18 0 M-2 0 L-12 -14 M-2 0 L-12 14 M14 0 L8 -6 M14 0 L8 6 M-16 0 L-20 -6 M-16 0 L-20 6" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- pins -->
  <g>
    <path d="M60 300 c-12 -16 -12 -30 0 -30 c12 0 12 14 0 30z" fill="#facc15"/>
    <circle cx="60" cy="282" r="4" fill="#1e1b4b"/>
    <path d="M740 200 c-12 -16 -12 -30 0 -30 c12 0 12 14 0 30z" fill="#22d3ee"/>
    <circle cx="740" cy="182" r="4" fill="#1e1b4b"/>
  </g>

  <!-- ticket card -->
  <g transform="rotate(-7 150 400)">
    <rect x="50" y="350" width="210" height="96" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="70" y="378" fill="#e0e7ff" font-size="11">FROM</text>
    <text x="70" y="400" fill="#ffffff" font-size="20" font-weight="800">MAA</text>
    <text x="240" y="378" fill="#e0e7ff" font-size="11" text-anchor="end">TO</text>
    <text x="240" y="400" fill="#ffffff" font-size="20" font-weight="800" text-anchor="end">GOI</text>
    <path d="M130 393 h50" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="70" y="430" fill="#fde68a" font-size="12" font-weight="700">Sat, 3 days · 2 travellers</text>
  </g>

  <!-- phone -->
  <rect x="290" y="30" width="220" height="450" rx="36" fill="#0b0b1e" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
  <rect x="302" y="42" width="196" height="426" rx="28" fill="url(#screen)"/>
  <rect x="368" y="52" width="64" height="9" rx="4.5" fill="#0b0b1e"/>
  <text x="316" y="94" fill="#0f172a" font-size="17" font-weight="800">Plan your trip</text>
  <g clip-path="url(#photo)">
    <rect x="314" y="110" width="172" height="120" fill="url(#card)"/>
    <circle cx="450" cy="140" r="16" fill="#fde68a"/>
    <path d="M314 200 L360 160 L395 190 L430 150 L486 200 L486 230 L314 230 Z" fill="#0f766e"/>
    <path d="M314 215 Q400 195 486 215 L486 230 L314 230 Z" fill="#115e59"/>
  </g>
  <text x="316" y="256" fill="#0f172a" font-size="15" font-weight="800">Goa Beach Getaway</text>
  <text x="316" y="274" fill="#64748b" font-size="11.5">★ 4.8 · 3 days · 2 nights</text>

  <g font-size="12" fill="#0f172a">
    <line x1="324" y1="300" x2="324" y2="380" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="324" cy="300" r="6" fill="#7c3aed"/><text x="340" y="304" font-weight="600">Day 1 · Arrive &amp; beach</text>
    <circle cx="324" cy="340" r="6" fill="#f97316"/><text x="340" y="344" font-weight="600">Day 2 · Fort &amp; market</text>
    <circle cx="324" cy="380" r="6" fill="#0ea5a4"/><text x="340" y="384" font-weight="600">Day 3 · Sunset cruise</text>
  </g>
  <rect x="316" y="408" width="168" height="42" rx="21" fill="#7c3aed"/>
  <text x="400" y="434" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Book trip</text>
</svg>
