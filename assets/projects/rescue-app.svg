<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0a16"/>
      <stop offset="1" stop-color="#0b1430"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#ef4444" stop-opacity=".55"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#f97316" stop-opacity=".4"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <radialGradient id="sos" cx=".4" cy=".35"><stop offset="0" stop-color="#fca5a5"/><stop offset=".45" stop-color="#ef4444"/><stop offset="1" stop-color="#991b1b"/></radialGradient>
    <clipPath id="screenClip"><rect x="302" y="42" width="196" height="426" rx="28"/></clipPath>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="300" fill="url(#g1)"/>
  <circle cx="700" cy="80" r="200" fill="url(#g2)"/>

  <!-- left card: help on the way -->
  <g transform="rotate(-5 160 200)">
    <rect x="60" y="140" width="200" height="120" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="80" y="162" width="44" height="44" rx="12" fill="#ef4444" fill-opacity=".22"/>
    <path d="M102 172v24M90 184h24" stroke="#fca5a5" stroke-width="5" stroke-linecap="round"/>
    <text x="136" y="180" fill="#e8eef9" font-size="14" font-weight="700">Help is on</text>
    <text x="136" y="198" fill="#e8eef9" font-size="14" font-weight="700">the way</text>
    <text x="80" y="236" fill="#a3b3cf" font-size="12">Rescue team ETA</text>
    <text x="240" y="236" fill="#fdba74" font-size="15" font-weight="800" text-anchor="end">6 min</text>
  </g>

  <!-- right card: emergency contacts -->
  <g transform="rotate(4 650 330)">
    <rect x="550" y="260" width="200" height="140" rx="20" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="570" y="290" fill="#e8eef9" font-size="14" font-weight="700">Emergency contacts</text>
    <circle cx="584" cy="318" r="12" fill="#f97316" fill-opacity=".35"/>
    <rect x="604" y="312" width="90" height="8" rx="4" fill="#ffffff" fill-opacity=".35"/>
    <circle cx="584" cy="350" r="12" fill="#22d3ee" fill-opacity=".35"/>
    <rect x="604" y="344" width="70" height="8" rx="4" fill="#ffffff" fill-opacity=".35"/>
    <rect x="570" y="372" width="160" height="16" rx="8" fill="#34d399" fill-opacity=".18"/>
    <text x="650" y="384" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">Location shared</text>
  </g>

  <!-- phone -->
  <rect x="290" y="30" width="220" height="450" rx="36" fill="#050b18" stroke="#5b2a3a" stroke-width="2"/>
  <g clip-path="url(#screenClip)">
    <rect x="302" y="42" width="196" height="426" fill="#101b31"/>
    <!-- map -->
    <path d="M290 140 L520 110 M290 230 L520 260 M360 30 L380 480 M450 30 L430 480" stroke="#26365a" stroke-width="12"/>
    <path d="M290 180 L520 200 M300 330 L520 300" stroke="#1d2b49" stroke-width="6"/>
    <ellipse cx="470" cy="160" rx="34" ry="22" fill="#14532d" fill-opacity=".6"/>
    <ellipse cx="330" cy="290" rx="30" ry="20" fill="#14532d" fill-opacity=".6"/>
    <path d="M330 110 C 360 170, 380 160, 400 215" stroke="#f87171" stroke-width="4" stroke-dasharray="8 7" fill="none" stroke-linecap="round"/>
    <circle cx="330" cy="110" r="7" fill="#fdba74" stroke="#fff" stroke-width="2"/>
    <!-- pulse -->
    <circle cx="400" cy="215" r="20" fill="#ef4444" fill-opacity=".25">
      <animate attributeName="r" values="14;46;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values=".45;0;.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M400 222 C 380 196, 382 176, 400 176 C 418 176, 420 196, 400 222 Z" fill="#ef4444" stroke="#fff" stroke-width="2.5"/>
    <circle cx="400" cy="191" r="5" fill="#fff"/>
    <!-- bottom sheet -->
    <rect x="302" y="320" width="196" height="160" rx="22" fill="#0a1124"/>
    <rect x="380" y="330" width="40" height="5" rx="2.5" fill="#334155"/>
    <circle cx="400" cy="405" r="48" fill="#ef4444" fill-opacity=".18"/>
    <circle cx="400" cy="405" r="38" fill="url(#sos)"/>
    <text x="400" y="413" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle">SOS</text>
  </g>
  <rect x="368" y="52" width="64" height="9" rx="4.5" fill="#050b18"/>
  <rect x="316" y="72" width="168" height="34" rx="17" fill="#0a1124" fill-opacity=".9"/>
  <circle cx="336" cy="89" r="5" fill="#ef4444"/>
  <text x="348" y="94" fill="#e8eef9" font-size="13" font-weight="700">Rescue App</text>
</svg>
